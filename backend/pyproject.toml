[project]
name = "code-butler-backend"
version = "0.1.0"
description = "Code Butler — the planning engine behind the calm builder."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
agents = ["google-adk>=1.2"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
